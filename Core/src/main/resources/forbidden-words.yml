# 宠物名称词库配置。
#
# 内置大型词库保存在插件 JAR 中，升级插件时自动更新，不会把数千行内容写进本文件。
# 插件不会在启动、重载或玩家改名时访问外网，因此 GitHub 不可用也不会影响服务器。
# 拥有 combatpets.bypass.name.words 权限的管理员不受词库限制。
ConfigVersion: 2

# 是否启用插件内置的大型中文名称词库。
Use_BuiltIn_Word_List: true

# 完整宠物名称白名单。
# 仅当规范化后的整个名称完全匹配时放行，避免白名单内容被拼接后绕过检查。
AllowedWords: []

# 服务器自定义追加词库，每行填写一个词或短语。
# 插件会忽略大小写、空格、常见符号、全角/半角及颜色格式后检查。
# 保存后执行 /pets reload 即可生效。
ForbiddenWords: []
