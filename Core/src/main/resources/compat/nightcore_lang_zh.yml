    - '<gray>点击 <click:run_command:"/#exit"><hover:show_text:"<gray>点击取消输入。</gray>"><green>[这里]</green></hover></click> 退出输入模式。</gray>'
    - ''
  Button:
    OK:
      Label: <green>✔</green> 确定
      Width: 150
    Cancel:
      Label: <red>✘</red> 取消
      Width: 150
    Apply:
      Label: <green>✔</green> 应用
      Width: 150
    Confirm:
      Label: <green>✔</green> 确认
      Width: 150
    Reset:
      Label: <red>✘</red> 重置
      Width: 150
    Back:
      Label: <soft_yellow>←</soft_yellow> 返回
      Width: 150
Editor:
  Action:
    Exit:
    - '[prefix="false"]'
    - ''
    - '<gray>点击 <click:run_command:"/#exit"><hover:show_text:"<gray>点击取消输入。</gray>"><green>[这里]</green></hover></click> 退出输入模式。</gray>'
    - ''
  Input:
    Header:
      Main: <green><b>输入模式</b></green>
      Error: <red><b>错误</b></red>
    Error:
      NotInteger: <gray>请输入<red>整数</red>！</gray>
      Generic: <gray>输入内容无效！</gray>
